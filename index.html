  <head>
    <!-- loading样式 - 优先加载，避免渲染阻塞 -->
    <style>
      body, html {
        padding: 0;
        margin: 0;
      }
      #global-loading {
        display: none !important;
      }
      html[data-in-iframe="true"] #global-loading {
        display: none !important;
      }
      /* iframe内loading样式 - 参考UrlChangeLoading.tsx */
      #global-loading.iframe-mode {
        flex-flow: column;
        border-radius: 12px;
      }
      .iframe-loading-container {
        position: relative;
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: center;
        transform: translateY(-50%);
        overflow: hidden;
      }
      .iframe-loading-text {
        position: relative;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        margin-top: -25px;
        font-weight: 500;
        font-size: 14px;
        line-height: 100%;
        color: #000;
        opacity: 0.3;
        text-align: center;
        white-space: nowrap;
      }
      .iframe-loading-text::after {
        content: '';
        animation: dot-blink 2s linear infinite;
        position: absolute;
        top: 0;
        left: 100%;
      }
      @keyframes dot-blink {
        0% { content: '.'; }
        50% { content: '..'; }
        100% { content: '...'; }
      }
      /* 非iframe下的原始loading样式（已停用） */
      .default-loading-container {
        display: none;
      }
    </style>

    <script>
      (function() {
        if (typeof window === 'undefined') {
          return;
        }

        try {
          if (window.self !== window.top) {
            document.documentElement.setAttribute('data-in-iframe', 'true');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-in-iframe', 'true');
        }
      })();
    </script>

  <body class="antialiased">
    <script>
      window.__location__ = {
        href: window.location.href,
        pathname: window.location.pathname,
        search: window.location.search,
        hash: window.location.hash,
        origin: window.location.origin,
        protocol: window.location.protocol,
        host: window.location.host,
      }
    </script>
    <div id="root">
      <div id="global-loading"></div>
    </div>
    <script>
      (function() {
        // SSR兼容：检查window对象是否存在
        if (typeof window === 'undefined') {
          return;
        }
        
        var isInIframe = false;
        try {
          isInIframe = window.self !== window.top;
        } catch (e) {
          // 跨域情况下无法访问window.top，说明在iframe中
          isInIframe = true;
        }
        
        var globalLoading = document.getElementById('global-loading');
        if (!globalLoading) {
          return;
        }
        
        if (isInIframe) {
          document.documentElement.setAttribute('data-in-iframe', 'true');
          globalLoading.classList.remove('iframe-mode');
          globalLoading.innerHTML = '';
          globalLoading.style.display = 'none';
          return;
        }
        globalLoading.innerHTML = '';
        globalLoading.style.display = 'none';
      })();
    </script>
